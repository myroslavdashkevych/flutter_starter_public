# Monthly version updates into develop (doc/guide/setup.md, Dependabot).
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    target-branch: develop
    versioning-strategy: increase
    open-pull-requests-limit: 3
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    groups:
      pub-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
